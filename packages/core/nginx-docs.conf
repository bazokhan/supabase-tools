server {
    listen 80;

    # Backend Atlas (docs output directory)
    location /atlas/ {
        alias /srv/atlas/;
        index backend-atlas.html;
        try_files $uri $uri/ =404;
    }

    # SchemaSpy output
    location /schemaspy/ {
        alias /srv/schemaspy/;
        index index.html;
        autoindex on;
    }

    # Root redirect to atlas
    location = / {
        return 302 /atlas/backend-atlas.html;
    }
}
